<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AutoMenu AI</title>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "@dnd-kit/core": "https://esm.sh/@dnd-kit/core@6.0.8?external=react,react-dom",
    "@dnd-kit/sortable": "https://esm.sh/@dnd-kit/sortable@7.0.2?external=react,react-dom",
    "@dnd-kit/utilities": "https://esm.sh/@dnd-kit/utilities@3.2.1?external=react,react-dom",
    "@imgly/background-removal": "https://esm.sh/@imgly/background-removal@1.5.5",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "vite-plugin-static-copy": "https://aistudiocdn.com/vite-plugin-static-copy@^3.1.4"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <main style="min-height:90vh;display:grid;place-content:center;text-align:center;font:16px system-ui;color:#334155">
        <p id="startup-status" role="status">Carregando AutoMenu…</p>
        <button id="startup-retry" type="button" hidden>Recarregar</button>
      </main>
    </div>
    <script>
      document.getElementById('startup-retry').addEventListener('click', () => location.reload());
      setTimeout(() => {
        const status = document.getElementById('startup-status');
        if (!status) return;
        status.textContent = 'O AutoMenu está demorando para carregar.';
        document.getElementById('startup-retry').hidden = false;
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
